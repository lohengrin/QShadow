# Reusable build: configure, build, test and package on Linux and Windows.
# Called by ci.yml (push / PR) and release.yml (tags).
name: build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config file \
            qt6-base-dev qt6-multimedia-dev qt6-wayland libjpeg-turbo8-dev \
            libasound2-dev libvulkan-dev libwayland-dev libegl-dev libgles-dev \
            libdrm-dev libgbm-dev glslang-tools

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: Package tar.gz
        run: |
          cpack --config build/CPackConfig.cmake -B dist
          ls -l dist

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QMAKE: /usr/lib/qt6/bin/qmake6
          EXTRA_PLATFORM_PLUGINS: libqwayland-egl.so;libqwayland-generic.so
          EXTRA_QT_PLUGINS: wayland-decoration-client;wayland-graphics-integration-client;wayland-shell-integration;multimedia
        run: |
          VERSION=$(sed -n 's/^project(qshadow VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          base=https://github.com/linuxdeploy
          curl -fsSL -o linuxdeploy "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-qt "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export PATH="$PWD:$PATH"
          DESTDIR="$PWD/AppDir" cmake --install build
          # GPU / driver / session libraries always come from the host.
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage \
            --desktop-file AppDir/usr/share/applications/qshadow.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/qshadow.svg \
            --exclude-library 'libvulkan.so*' --exclude-library 'libasound.so*' \
            --exclude-library 'libEGL*' --exclude-library 'libGL.so*' \
            --exclude-library 'libGLX*' --exclude-library 'libGLdispatch*' \
            --exclude-library 'libgbm*' --exclude-library 'libdrm*' \
            --exclude-library 'libwayland-*'
          mv QShadow*.AppImage "dist/qshadow-$VERSION-linux-x86_64.AppImage"

      - name: Verify AppImage contents
        run: |
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE"/dist/*.AppImage --appimage-extract >/dev/null
          if find squashfs-root -name 'libvulkan.so*' -o -name 'libasound.so*' \
               -o -name 'libEGL*' -o -name 'libgbm*' -o -name 'libwayland-client*' | grep .; then
            echo "::error::AppImage bundles host GPU/session libraries"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    env:
      VCPKG_ROOT: C:\vcpkg-ci
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4

      # Qt from vcpkg takes ~2.5 h to build cold; cache the binary packages. Saved
      # explicitly right after Configure (see below) so a later failing step cannot
      # throw the build away: actions/cache alone only saves when the whole job passes.
      - uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # The manifest pins a builtin-baseline, so vcpkg needs that commit.
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout $baseline
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset windows-ci

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        run: cmake --build --preset windows-ci

      - name: Test
        env:
          QTEST_FUNCTION_TIMEOUT: "60000"   # Qt Test aborts a hung test function and names it
        run: ctest --preset windows-ci --timeout 120

      - name: Diagnose test failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build-ci/tests -Filter *.dll | Select-Object -ExpandProperty FullName
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process build-ci/tests/tst_mainwindow.exe -ArgumentList "-v2" `
                 -RedirectStandardOutput out.txt -RedirectStandardError err.txt -PassThru -NoNewWindow
          if (-not $p.WaitForExit(60000)) { $p.Kill(); "tst_mainwindow still hangs" }
          Get-Content out.txt, err.txt

      - name: Package zip
        run: cpack --config build-ci/CPackConfig.cmake -B dist

      - name: Verify zip contents
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath verify
          if (Get-ChildItem verify -Recurse -Filter 'vulkan-1*.dll') {
            Write-Error "zip bundles vulkan-1.dll (must come from the GPU driver)"; exit 1
          }
          if (-not (Get-ChildItem verify -Recurse -Filter qwindows.dll)) {
            Write-Error "zip is missing the Qt windows platform plugin"; exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error
